[project]
name = "ndd-cell-type-vs-state"
version = "1.0.0"
description = "Disentangling transcriptomic cell type from activity state in mouse cortex"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Peter Hogg" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=16",
    "scanpy>=1.10",
    "anndata>=0.10",
    "h5py>=3.10",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
# Streaming NWB data from DANDI (IBL units, V1 interneuron recordings).
dandi = ["dandi>=0.60", "pynwb>=2.8", "remfile>=0.1", "requests>=2.31"]
# Notebooks.
notebooks = ["jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6"]
# Third-party Allen feature extractor.
extractor = ["six>=1.16"]

[tool.uv]
package = false
